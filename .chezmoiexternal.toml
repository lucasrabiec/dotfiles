[".config/nvim"]
type = "git-repo"
url = "git@github.com:lucasrabiec/nvim.git"
refreshPeriod = "24h"

[".config/nvim".pull]
args = ["--ff-only"]

[".local/share/timewarrior/data"]
type = "git-repo"
url = "git@github.com:lucasrabiec/timewarrior-data.git"

[".local/share/timewarrior/data".pull]
args = ["--ff-only"]

[".config/omarchy/plugins/now-playing"]
type = "git-repo"
url = "https://github.com/bjarneo/omarchy-now-playing.git"
refreshPeriod = "168h"

[".config/omarchy/plugins/now-playing".pull]
args = ["--ff-only"]

[".config/omarchy/plugins/gpdenny.linear"]
type = "git-repo"
url = "https://github.com/gpdenny/omarchy-linear.git"
refreshPeriod = "168h"

[".config/omarchy/plugins/gpdenny.linear".pull]
args = ["--ff-only"]

[".local/bin/hypr-session-restore"]
type = "file"
url = "https://raw.githubusercontent.com/UpayanChatterjee/hypr-session-restore/main/hypr-session-restore"
executable = true
refreshPeriod = "168h"

[".config/tmux/plugins/tpm"]
type = "git-repo"
url = "https://github.com/tmux-plugins/tpm.git"
refreshPeriod = "168h"

[".config/tmux/plugins/tpm".pull]
args = ["--ff-only"]

[".config/omarchy/themes/dracula"]
type = "git-repo"
url = "https://github.com/catlee/omarchy-dracula-theme.git"
refreshPeriod = "168h"

[".config/omarchy/themes/dracula".pull]
args = ["--ff-only"]
